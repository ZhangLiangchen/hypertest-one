[project]
name = "hypertest-one"
version = "0.2.0"
description = "HyperTest One — Agent-native autonomous testing control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "websockets>=14,<18",
]

[project.optional-dependencies]
cloud-crypto = [
  "cryptography>=44,<47",
]
memory = [
  "httpx>=0.28,<1.0",
]
cloud = [
  "cryptography>=44,<47",
  "httpx>=0.28,<1.0",
  "deepseek-harness-sdk==0.2.1rc2",
  "deepseek-harness-runtime-bin==0.2.1rc2",
]
native = [
  "httpx>=0.28,<1.0",
]
interactive = [
  "mcp>=1.28,<2",
  "httpx>=0.28,<1.0",
  "jsonschema>=4.20,<5",
]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
hypertest = "hypertest.cli.__main__:main"
hypertest-deepseek = "hypertest.deepseek_probe:main"
hypertest-cloud = "hypertest.cloud.__main__:main"
hypertest-local = "hypertest.local_sync.__main__:main"
hypertest-interactive = "hypertest.interactive_client.__main__:main"
hypertest-native = "hypertest.native_client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypertest"]

[tool.hatch.build.targets.wheel.force-include]
"skills/hypertest-archive/SKILL.md" = "hypertest/cli/assets/skills/hypertest-archive/SKILL.md"
"skills/hypertest-archive/agents/openai.yaml" = "hypertest/cli/assets/skills/hypertest-archive/agents/openai.yaml"
"skills/hypertest-archive/references/manifest.md" = "hypertest/cli/assets/skills/hypertest-archive/references/manifest.md"
"skills/hypertest-local-task-onboarding/SKILL.md" = "hypertest/local_sync/assets/skills/hypertest-local-task-onboarding/SKILL.md"
"skills/hypertest-local-task-onboarding/agents/openai.yaml" = "hypertest/local_sync/assets/skills/hypertest-local-task-onboarding/agents/openai.yaml"
"skills/hypertest-local-task-onboarding/references/setup.md" = "hypertest/local_sync/assets/skills/hypertest-local-task-onboarding/references/setup.md"
"skills/hypertest-local-task-onboarding/references/sync-contract.md" = "hypertest/local_sync/assets/skills/hypertest-local-task-onboarding/references/sync-contract.md"
"skills/hypertest-local-task-onboarding/references/troubleshooting.md" = "hypertest/local_sync/assets/skills/hypertest-local-task-onboarding/references/troubleshooting.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008", # FastAPI dependency injection intentionally calls Depends in defaults.
  "E501", # Formatting/long signatures are handled separately from semantic lint.
]
