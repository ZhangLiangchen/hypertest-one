name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HYPERTEST_DATABASE_URL: postgresql+asyncpg://hypertest:hypertest@localhost:5432/hypertest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hypertest
          POSTGRES_PASSWORD: hypertest
          POSTGRES_DB: hypertest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hypertest -d hypertest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e '.[dev,interactive]'
      - name: Lint
        run: ruff check src tests alembic
      - name: Migrate
        run: alembic upgrade head
      - name: Test
        run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Test web helpers
        run: npm test
      - name: Typecheck web
        run: npm run typecheck
      - name: Build web
        run: npm run build
