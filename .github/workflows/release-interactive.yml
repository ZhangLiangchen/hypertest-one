name: release-interactive-mcp

on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: write

concurrency:
  group: interactive-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wheel build tools
        run: python -m pip install build==1.2.2.post1 hatchling==1.27.0
      - name: Build from the exact tagged commit
        run: >-
          python scripts/build-interactive-release.py
          --tag "$GITHUB_REF_NAME" --ref "$GITHUB_SHA" --require-tag
          --output "$RUNNER_TEMP/hypertest-mcp-release"
      - name: Smoke the installed wheel outside the repository
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import venv

          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          assets = root / "hypertest-mcp-release"
          manifest = json.loads((assets / "release-manifest.json").read_text())
          environment = root / "hypertest-mcp-wheel-smoke"
          venv.EnvBuilder(with_pip=True).create(environment)
          python = environment / "bin" / "python"
          subprocess.run([str(python), "-m", "pip", "install",
                          str(assets / manifest["wheel"]["filename"]) + "[interactive]"], check=True)
          smoke = r'''
          import json
          from importlib.resources import files
          import hypertest.interactive_client.__main__
          import hypertest.interactive_client.mcp_server
          import hypertest.interactive_client.setup
          assets = files("hypertest.interactive_client").joinpath("assets")
          assert json.loads(assets.joinpath("config.example.json").read_text())["api_url"]
          assert json.loads(assets.joinpath("session-sync.config.example.json").read_text())["host_adapter"]["kind"] == "unsupported"
          assert json.loads(assets.joinpath("mcp.example.json").read_text())["mcpServers"]
          assert "name: hypertest-interactive" in assets.joinpath("hypertest-interactive/SKILL.md").read_text()
          print("Installed MCP modules and bundled assets verified")
          '''
          subprocess.run([str(python), "-I", "-c", smoke], cwd=root, check=True)
          for command in ([], ["setup"], ["doctor"]):
              subprocess.run([str(python), "-I", "-m", "hypertest.interactive_client",
                              *command, "--help"], cwd=root, check=True)
          subprocess.run([str(environment / "bin" / "hypertest-interactive"), "--help"], cwd=root, check=True)
          PY
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "HyperTest interactive MCP $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/hypertest-mcp-release/INSTALL.md" \
            "$RUNNER_TEMP/hypertest-mcp-release/"*
