# Public IPv4 entry restricted to the confirmed VPN egress.
# Activate only through the reviewed ops/activate-vpn-allowlist.sh workflow.
# Existing 127.0.0.1:8080 tunnel site remains unchanged.
# No Real-IP or PROXY protocol trust; access ACL uses the TCP peer address.
map $request_method $hypertest_vpn_unsafe_method {
    default 1;
    GET 0;
    HEAD 0;
    OPTIONS 0;
}
map $http_origin $hypertest_vpn_foreign_origin {
    default 1;
    "" 0;
    "http://155.138.206.106:8080" 0;
}
map "$hypertest_vpn_unsafe_method:$hypertest_vpn_foreign_origin" $hypertest_vpn_reject_origin {
    default 0;
    "1:1" 1;
}
log_format hypertest_vpn_allowlist '$remote_addr [$time_iso8601] '
    '"$request_method $uri $server_protocol" $status bytes=$body_bytes_sent';

server {
    listen 155.138.206.106:8080 default_server;
    server_name 155.138.206.106;
    client_max_body_size 10m;

    satisfy all;
    allow 45.76.149.233/32;
    deny all;

    if ($host != "155.138.206.106") { return 444; }
    if ($hypertest_vpn_reject_origin) { return 403; }

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    access_log /var/log/nginx/hypertest-vpn-access.log hypertest_vpn_allowlist;
    error_log /var/log/nginx/hypertest-vpn-error.log warn;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_read_timeout 300s;
    }
}
